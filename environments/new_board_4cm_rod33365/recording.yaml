schema_version: 1
recording:
  sample_dt_s: 0.010
  time_source: trajectory_time
  canonical_source: controller_action_goal
  record_controller_actual: true
  record_joint_states: true
  record_joint_frames: true
  record_tip_state: true
  output_fields:
    positions: true
    velocities: true
    accelerations: true
  first_point:
    time_s: 0.0
    require_zero_velocity: true
    require_zero_acceleration: true
  last_point:
    require_zero_velocity: true
    require_zero_acceleration: true
  validation:
    max_missing_samples: 0
    max_time_jitter_s: 0.002
    max_quaternion_norm_error: 0.001
    require_action_success: true
    max_completion_overrun_s: 0.05
    max_controller_reference_position_error_rad: 0.02
    max_controller_reference_velocity_error_rad_s: 0.10
    max_joint_position_tracking_error_rad: 0.02
    max_joint_velocity_tracking_error_rad_s: 0.10
    max_actual_controller_position_error_rad: 0.02
    max_actual_controller_velocity_error_rad_s: 0.10
    max_frame_fk_position_error_m: 0.001
    max_frame_fk_orientation_error_deg: 0.1
start_state:
  max_joint_error_rad: 0.02
  settle_velocity_rad_s: 0.01
  mismatch_policy: curobo_prepare
  prepare_sequence: home_then_recording_start
